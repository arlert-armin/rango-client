name: Detect Publish Flag
description: 'Maps the current branch to the release channel flag rangutopia expects.'

outputs:
  flag:
    description: "One of '--prod', '--next' or '--experimental'."
    value: ${{ steps.detect.outputs.flag }}

runs:
  using: 'composite'
  steps:
    - id: detect
      run: |
        case "${{ github.ref }}" in
          refs/heads/main) FLAG='--prod' ;;
          # TEST ONLY: exercise the '--prod' path (and release-root with it)
          # without pushing to main. Remove before this lands anywhere real.
          refs/heads/ci/test-rangutopia-publishing) FLAG='--prod' ;;
          refs/heads/next) FLAG='--next' ;;
          *)               FLAG='--experimental' ;;
        esac
        echo "Releasing on ${FLAG#--} (ref: ${{ github.ref }})"
        echo "flag=$FLAG" >> "$GITHUB_OUTPUT"
      shell: 'bash'
